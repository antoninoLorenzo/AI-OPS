name: "Docs"

on:
  push:
    branches: [ main, dev ]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Dependencies
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --only-group docs --frozen

      - name: Build docs (strict)
        run: |
          source .venv/bin/activate
          mkdocs build --strict

  # Publishes to GitHub Pages via the Actions deployment (no gh-pages branch,
  # no force-push). One-time setup: Settings > Pages > Build and deployment >
  # Source = "GitHub Actions".
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Dependencies
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --only-group docs --frozen

      - name: Build docs (strict)
        run: |
          source .venv/bin/activate
          mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

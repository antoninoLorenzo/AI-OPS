name: "Build Docker Image for API"

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-scan-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Extract version
        id: version
        run: |
          v=$(grep -m1 '^version' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (local only)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Scan Image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-container.sarif'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: '.trivyignore'

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-container.sarif'

      - name: Smoke test
        run: |
          IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          # AI_OPS_MODEL is the only required setting; host defaults to 127.0.0.1
          # so auth is the permissive no-op, and run.py binds uvicorn to 0.0.0.0
          # so the mapped port is reachable from the runner.
          docker run -d --name aiops -p 8000:8000 -e AI_OPS_MODEL=openai/smoke "$IMG"

          # the Dockerfile runs as a non-root user
          test "$(docker exec aiops whoami)" = "aiops"

          # any HTTP response means the server booted and serves (not a live-LLM test)
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Host: 127.0.0.1" http://127.0.0.1:8000/health || echo 000)
            [ "$code" != "000" ] && { ok=1; break; }
            sleep 2
          done

          docker logs aiops
          docker rm -f aiops
          [ "$ok" = 1 ] || { echo "API did not come up"; exit 1; }

      - name: Log in to GHCR
        if: success()
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        if: success()
        run: |
          IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          
          docker tag $IMG:${{ github.sha }} $IMG:${{ steps.version.outputs.value }}
          docker tag $IMG:${{ github.sha }} $IMG:latest
          docker push --all-tags $IMG
          
          echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' $IMG:${{ github.sha }} | cut -d@ -f2)" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation
        if: success()
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
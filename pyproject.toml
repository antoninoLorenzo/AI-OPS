[project]
name = "ai-ops"
version = "0.2.0"
description = "LLM-assisted penetration testing assistant"
requires-python = ">=3.12"

dependencies = [
    "bashlex>=0.18",
    "litellm>=1.49.7",
    "litellm[mlflow]",
    "mlflow>=3.11.1",
    "pydantic>=2.11",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
api = [
    "fastapi[standard]",
    "uvicorn",
    "httpx",
    "pydantic-settings"
]
cli = [
    "rich>=13.9.4",
    "prompt-toolkit",
    "requests>=2.33.0",
]
dev = [
    { include-group = "api" },
    { include-group = "cli" },
    { include-group = "bench" },
    "pytest>=9.0.2",
    "pytest-asyncio",
    "pytest-cov",
    "isort",
    "pylint",
    "pandas>=2.2.2",
    "numpy",
    "matplotlib~=3.9.0",
    "seaborn~=0.13.2",
    "tqdm~=4.66.4",
    "transformers>=5.5.3",
    "streamlit>=1.40"
]
bench = [
    "autopenbench"
]

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"

[tool.isort]
profile = "black"

[tool.uv.workspace]
exclude = [
    "benchmark/auto-pen-bench",
]

[tool.uv.sources]
autopenbench = { path = "benchmark/auto_pen_bench/auto-pen-bench", editable = true }

[tool.setuptools.packages.find]
include = ["ai_ops*"]
